<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品コード生成ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", Georgia, serif;
      background: #faf8f5;
      color: #2c2c2c;
      padding: 32px 20px 80px;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      color: #888;
      text-align: center;
      margin-bottom: 32px;
    }

    h2 {
      font-size: 0.9rem;
      font-weight: normal;
      letter-spacing: 0.1em;
      color: #999;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.8rem;
      color: #999;
      display: block;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }

    input[type=text], input[type=url] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d6cfc4;
      background: #fff;
      color: #2c2c2c;
      font-size: 0.9rem;
      font-family: inherit;
      margin-bottom: 14px;
      outline: none;
    }

    input[type=text]:focus, input[type=url]:focus {
      border-color: #2c2c2c;
    }

    .section {
      border: 1px solid #d6cfc4;
      padding: 20px 24px;
      margin-bottom: 16px;
      background: #fff;
    }

    .tag-group-label {
      font-size: 0.75rem;
      color: #bbb;
      letter-spacing: 0.1em;
      margin: 12px 0 6px;
    }

    .tag-group-label:first-of-type {
      margin-top: 0;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }

    .tag-btn {
      font-size: 0.78rem;
      padding: 4px 12px;
      border: 1px solid #d6cfc4;
      background: #faf8f5;
      color: #888;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s;
    }

    .tag-btn:hover {
      background: #f0e8dc;
      color: #2c2c2c;
    }

    .tag-btn.selected {
      background: #2c2c2c;
      color: #faf8f5;
      border-color: #2c2c2c;
    }

    .tag-btn.spoiler {
      border-color: #d6b8b8;
      color: #a06060;
      background: #fffafa;
    }

    .tag-btn.spoiler:hover {
      background: #fceeee;
    }

    .tag-btn.spoiler.selected {
      background: #a06060;
      color: #fff;
      border-color: #a06060;
    }

    .add-tag-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }

    .add-tag-row input {
      flex: 1;
      margin: 0;
      padding: 6px 10px;
      font-size: 0.82rem;
    }

    .add-tag-row select {
      padding: 6px 8px;
      border: 1px solid #d6cfc4;
      background: #faf8f5;
      color: #2c2c2c;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
    }

    .add-tag-row button {
      padding: 6px 16px;
      border: 1px solid #2c2c2c;
      background: #faf8f5;
      color: #2c2c2c;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }

    .add-tag-row button:hover {
      background: #2c2c2c;
      color: #faf8f5;
    }

    .output-area {
      background: #f5f3ef;
      border: 1px solid #d6cfc4;
      padding: 14px;
      font-size: 0.78rem;
      font-family: "Courier New", Courier, monospace;
      color: #2c2c2c;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 80px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-row button {
      padding: 8px 24px;
      border: 1px solid #2c2c2c;
      background: #faf8f5;
      color: #2c2c2c;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: background 0.15s, color 0.15s;
    }

    .btn-row button:hover {
      background: #2c2c2c;
      color: #faf8f5;
    }

    .btn-row button.copied {
      border-color: #7a9e7a;
      color: #7a9e7a;
    }

    .note {
      font-size: 0.78rem;
      color: #bbb;
      text-align: center;
      margin-top: 24px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <h1>— 作品コード生成ツール —</h1>

  <div class="section">
    <h2>作品情報</h2>
    <label>作品名</label>
    <input type="text" id="title" placeholder="例：辛党のオメガ">
    <label>URL</label>
    <input type="url" id="url" placeholder="https://...">
    <label>紹介文</label>
    <input type="text" id="comment" placeholder="例：〇〇 × △△ の関係性など">
  </div>

  <div class="section">
    <h2>通常タグ</h2>
    <div class="tag-group-label">世界観</div>
    <div class="tags" id="tags-sekai"></div>
    <div class="tag-group-label">話の長さ</div>
    <div class="tags" id="tags-nagasa"></div>
    <div class="tag-group-label">カップリング</div>
    <div class="tags" id="tags-cp"></div>
    <div class="tag-group-label">傾向</div>
    <div class="tags" id="tags-kikou"></div>
    <div class="add-tag-row">
      <input type="text" id="new-normal-tag" placeholder="新しいタグを追加">
      <select id="new-normal-group">
        <option value="sekai">世界観</option>
        <option value="nagasa">話の長さ</option>
        <option value="cp">カップリング</option>
        <option value="kikou" selected>傾向</option>
      </select>
      <button onclick="addNormalTag()">追加</button>
    </div>
  </div>

  <div class="section">
    <h2>ネタバレ・要注意タグ</h2>
    <div class="tags" id="tags-spoiler"></div>
    <div class="add-tag-row">
      <input type="text" id="new-spoiler-tag" placeholder="新しいタグを追加">
      <button onclick="addSpoilerTag()">追加</button>
    </div>
  </div>

  <div class="section">
    <h2>生成されたコード</h2>
    <div class="output-area" id="output">作品名とURLを入力するとコードが表示されます</div>
    <div class="btn-row">
      <button onclick="copyCode()" id="copy-btn">コピー</button>
      <button onclick="resetAll()">リセット</button>
    </div>
  </div>

  <p class="note">
    生成されたコードを works.html の作品リスト内にペーストしてください。<br>
    新しい作品ほど上に追加してください。
  </p>

  <script>
    const normalTags = {
      sekai:   ["ファンタジー","現代","異世界転移","異世界転生","オメガバース"],
      nagasa:  ["短編","長編"],
      cp:      ["学生","社会人","平凡受け","年上受け","人外受け","天然受け","溺愛攻め","人外攻め","無自覚攻め"],
      kikou:   ["性描写なし","ハッピーエンド","切ない","片想い","すれ違い","触手"]
    };

    const spoilerTags = [
      "バッドエンド","メリーバッドエンド","死ネタ",
      "主要人物が死ぬ（転生あり）","主要人物が死ぬ（転生なし）",
      "友人・親族が死ぬ","ペットが死ぬ","戦闘で人が死ぬ（モブ）",
      "流血表現","嘔吐表現"
    ];

    const selNormal  = new Set();
    const selSpoiler = new Set();

    function renderTags(groupId, tags, selected, type) {
      const el = document.getElementById("tags-" + groupId);
      el.innerHTML = "";
      tags.forEach(t => {
        const btn = document.createElement("button");
        btn.className = "tag-btn" +
          (type === "spoiler" ? " spoiler" : "") +
          (selected.has(t) ? " selected" : "");
        btn.textContent = t;
        btn.onclick = () => {
          selected.has(t) ? selected.delete(t) : selected.add(t);
          renderAll();
          updateOutput();
        };
        el.appendChild(btn);
      });
    }

    function renderAll() {
      renderTags("sekai",   normalTags.sekai,   selNormal,  "normal");
      renderTags("nagasa",  normalTags.nagasa,  selNormal,  "normal");
      renderTags("cp",      normalTags.cp,      selNormal,  "normal");
      renderTags("kikou",   normalTags.kikou,   selNormal,  "normal");
      renderTags("spoiler", spoilerTags,        selSpoiler, "spoiler");
    }

    function updateOutput() {
      const title = document.getElementById("title").value.trim();
      const url   = document.getElementById("url").value.trim();
      const comment = document.getElementById("comment").value.trim();

      if (!title && !url) {
        document.getElementById("output").textContent = "作品名とURLを入力するとコードが表示されます";
        return;
      }

      const allTags = [...selNormal, ...selSpoiler];
      const dataTagsAttr = allTags.length ? ` data-tags="${allTags.join(" ")}"` : "";

      const normalTagsHtml = [...selNormal].map(t =>
        `          <span class="work-tag">${t}</span>`
      ).join("\n");

      const spoilerTagsHtml = [...selSpoiler].map(t =>
        `            <span class="work-tag spoiler-tag matched-target">${t}</span>`
      ).join("\n");

      const spoilerBlock = selSpoiler.size > 0 ? `
        <div class="spoiler-container">
          <div class="spoiler-toggle">＋ ネタバレ・要注意タグを確認する</div>
          <div class="spoiler-content">
${spoilerTagsHtml}
          </div>
        </div>` : "";

      const code =
`      <div class="work-item"${dataTagsAttr}>
        <div class="work-main-row">
          <span class="work-title"><a href="${url || "#"}" target="_blank">${title || "（タイトル未入力）"}</a></span>
          <span class="work-tags">
${normalTagsHtml}
          </span>
        </div>${spoilerBlock}
${comment ? `        <p class="work-comment">${comment}</p>` : ""}
      </div>`;

      document.getElementById("output").textContent = code;
    }

    function addNormalTag() {
      const input = document.getElementById("new-normal-tag");
      const group = document.getElementById("new-normal-group").value;
      const val   = input.value.trim();
      if (!val) return;
      if (!normalTags[group].includes(val)) normalTags[group].push(val);
      input.value = "";
      renderAll();
      updateOutput();
    }

    function addSpoilerTag() {
      const input = document.getElementById("new-spoiler-tag");
      const val   = input.value.trim();
      if (!val) return;
      if (!spoilerTags.includes(val)) spoilerTags.push(val);
      input.value = "";
      renderAll();
      updateOutput();
    }

    function copyCode() {
      const text = document.getElementById("output").textContent;
      if (text === "作品名とURLを入力するとコードが表示されます") return;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copy-btn");
        btn.textContent = "コピーしました！";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "コピー";
          btn.classList.remove("copied");
        }, 2000);
      });
    }

    function resetAll() {
      document.getElementById("title").value = "";
      document.getElementById("url").value   = "";
      document.getElementById("comment").value = "";
      selNormal.clear();
      selSpoiler.clear();
      renderAll();
      updateOutput();
    }

    document.getElementById("title").addEventListener("input", updateOutput);
    document.getElementById("url").addEventListener("input", updateOutput);
    document.getElementById("comment").addEventListener("input", updateOutput);
    document.getElementById("new-normal-tag").addEventListener("keydown", e => {
      if (e.key === "Enter") addNormalTag();
    });
    document.getElementById("new-spoiler-tag").addEventListener("keydown", e => {
      if (e.key === "Enter") addSpoilerTag();
    });

    renderAll();
  </script>

</body>
</html>
